<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buma Venture — Logo Mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0c10; --text:#f5f5f0; --accent:#4a90d4; --border:#232530; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    margin: 0;
    padding: 60px 24px;
    display: flex;
    flex-direction: column;
    gap: 60px;
    align-items: center;
  }
  .option {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 480px;
  }
  .label {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .logo { display: flex; align-items: center; gap: 14px; font-size: 1.8rem; font-weight: 700; }
  .accent { color: var(--accent); }

  /* 1. Bracket Mark */
  .bracket { display: flex; align-items: center; gap: 10px; }
  .bracket-char { font-size: 2.2rem; font-weight: 700; color: var(--accent); }

  /* 3. Split Square */
  .split-square {
    width: 32px; height: 32px;
    position: relative;
    border: 2px solid var(--accent);
    border-radius: 4px;
    overflow: hidden;
  }
  .split-square::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 32px 32px 0 0;
    border-color: var(--accent) transparent transparent transparent;
  }
  .tracked { letter-spacing: 0.15em; font-size: 1.4rem; }

  /* 5. Monogram Badge */
  .badge {
    width: 48px; height: 48px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--accent); font-size: 1.2rem;
  }

  /* 2. Node & Line */
  .node-icon { display: flex; align-items: center; }
  .node-icon svg { display: block; }

  /* 4. Underline Accent */
  .underline-logo { position: relative; display: inline-block; padding-bottom: 6px; }
  .underline-logo::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: 0;
    width: 64%;
    height: 3px;
    background: var(--accent);
  }
</style>
</head>
<body>

<div class="option">
  <span class="label">Option 1 — Bracket Mark</span>
  <div class="bracket">
    <span class="bracket-char">[</span>
    <span class="logo">Buma<span class="accent">Venture</span></span>
    <span class="bracket-char">]</span>
  </div>
</div>

<div class="option">
  <span class="label">Option 3 — Split Square</span>
  <div class="logo">
    <div class="split-square"></div>
    <span class="tracked">BUMA VENTURE</span>
  </div>
</div>

<div class="option">
  <span class="label">Option 2 — Node &amp; Line</span>
  <div class="logo">
    <span class="node-icon">
      <svg width="40" height="24" viewBox="0 0 40 24" fill="none">
        <line x1="6" y1="18" x2="34" y2="6" stroke="#4a90d4" stroke-width="2"/>
        <circle cx="6" cy="18" r="5" fill="#4a90d4"/>
        <circle cx="34" cy="6" r="5" fill="none" stroke="#4a90d4" stroke-width="2"/>
      </svg>
    </span>
    <span>Buma<span class="accent">Venture</span></span>
  </div>
</div>

<div class="option">
  <span class="label">Option 4 — Underline Accent</span>
  <div class="underline-logo logo">
    Buma Venture
  </div>
</div>

<div class="option">
  <span class="label">Option 5 — Monogram Badge</span>
  <div class="logo">
    <div class="badge">BV</div>
    <span>Buma<span class="accent">Venture</span></span>
  </div>
</div>

</body>
</html>
